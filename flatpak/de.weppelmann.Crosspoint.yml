# Crosspoint als Flatpak.
#
# Baut direkt aus diesem Repo (nur path-Abhaengigkeiten, daher --offline) und
# bringt Icon, Desktop-Eintrag und die beiden Skripte mit. Die Engine laeuft im
# Sandbox als JACK-Client gegen das PipeWire des Hosts; die Oberflaeche ist eine
# Web-App, deren Fenster der Host-Browser oeffnet (flatpak-spawn --host).
app-id: de.weppelmann.Crosspoint
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: crosspoint-launch

finish-args:
  # Audio: PulseAudio-Socket des Hosts (PipeWire-Pulse) fuer pactl-Null-Sinks
  - --socket=pulseaudio
  # Nativer PipeWire-Zugriff (pw-link, pw-dump, JACK-Client)
  - --filesystem=xdg-run/pipewire-0
  - --share=ipc
  # Netzwerk-Namespace des Hosts: sonst ist die Steuer-API auf 127.0.0.1:8770
  # nur im Sandbox erreichbar und die Oberflaeche (Host-Browser) kaeme nicht heran.
  - --share=network
  # Konfiguration (~/.config/crosspoint) darf angelegt werden
  - --filesystem=~/.config/crosspoint:create
  # Fensterstart: Browser des Hosts starten (kein Browser im Runtime)
  - --talk-name=org.freedesktop.Flatpak

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/crosspoint/cargo

modules:
  - name: crosspoint
    buildsystem: simple
    build-commands:
      - cargo build --release --offline --locked
      - install -Dm755 target/release/crosspoint-engine /app/bin/crosspoint-engine
      - install -Dm755 scripts/crosspoint-launch.sh /app/bin/crosspoint-launch
      - install -Dm755 scripts/crosspoint-wire.sh /app/bin/crosspoint-wire.sh
      - install -Dm644 data/de.weppelmann.Crosspoint.desktop /app/share/applications/de.weppelmann.Crosspoint.desktop
      - |
        for n in 16 32 48 64 128 256 512; do
          install -Dm644 "data/icons/hicolor/${n}x${n}/apps/de.weppelmann.Crosspoint.png" \
            "/app/share/icons/hicolor/${n}x${n}/apps/de.weppelmann.Crosspoint.png"
        done
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - target
          - build-dir
          - crates/macros/target
          - crates/tape/target
          - crates/vban/target
