; ==================================================================
; Crosspoint: nanoKONTROL2 -> OSC
; ==================================================================
;
; Diese Datei ist die fertige Zuordnung von einem MIDI-Controller auf den
; OSC-Eingang der Engine (src/osc.rs). MIDI spricht MIDIMonster, die Engine
; bekommt nur OSC über UDP - so muss in der Engine kein ALSA-Code liegen.
;
; Start (in dieser Reihenfolge, die Engine zuerst):
;   crosspoint-engine                         ; hoert auf 127.0.0.1:9000
;   midimonster /pfad/zu/data/midimonster.cfg
;
; Andere Adresse/Port der Engine:  CROSSPOINT_OSC_ADDR=0.0.0.0:9000
; Rueckmeldung (Fader-/LED-Rueckweg): CROSSPOINT_OSC_ECHO=1
; Dann muss auch "dest" unten angepasst werden.
;
; MIDIMonster selbst: https://github.com/cbdevnet/midimonster
;   Bauen:  make            (braucht gcc, make, alsa-lib-devel, libsndfile-devel)
;   Pakete: "midimonster" liegt in einigen Distributionen fertig bereit
;           (Fedora/Debian) - dann genuegt ein "midimonster <diese Datei>".
;   Pruefen: einfach starten. Die Ausgabe zeigt beim Start jede Zeile als
;           "Matched pattern ... for /strip/0/gain" (Zuordnung passt) bzw.
;           "Failed to get ... device address" (Geraetename noch Platzhalter).
;
; Die Zahlen in den OSC-Adressen sind 0-basiert (wie "index" in /api/set):
; /strip/0 ist der erste Streifen, /bus/0 ist A1.

; ==================================================================
; 1. Das MIDI-Geraet
; ==================================================================
;
; "nanokontrol2" ist ein PLATZHALTER. Vor dem ersten Start den echten Namen
; eintragen. So findet man ihn (Geraet einstecken, dann):
;
;   aconnect -i
;        client 0: 'System' [type=kernel]
;        client 20: 'nanoKONTROL2' [type=kernel]
;            0 'nanoKONTROL2 MIDI 1'
;   aseqdump -l                ; Kurzform derselben Liste
;   ls /proc/asound/cards      ; Karte und Nummer
;
; Als "read"/"write" nimmt MIDIMonster entweder "client:port" (hier 20:0,
; eindeutig - gut bei mehreren gleichen Geraeten) oder einen Praefix des
; Geraetenamens (hier "nanoKONTROL2", Gross-/Kleinschreibung beachten).
;
; Steckt das Geraet an einem anderen Port, klemmt etwas, lohnt:
;   midimonster mit "detect = on"      (gibt jeden eingehenden Kanal aus)
[midi nanokontrol2]
read = nanoKONTROL2
write = nanoKONTROL2

; ==================================================================
; 2. Der OSC-Eingang der Engine
; ==================================================================
;
; "bind" ist der eigene Port: auf 9001 kommen die Rueckmeldungen der Engine
; an (sie gehen an den Absender, nicht an eine feste Adresse).
; "dest" ist die Engine aus src/osc.rs (Vorgabe 127.0.0.1:9000).
[osc crosspoint]
bind = 127.0.0.1 9001
dest = 127.0.0.1 9000

; Wertebereiche. Erst diese Zeilen machen aus einem Fader (CC 0..127) die
; dB-Werte, die die Engine erwartet: MIDIMonster rechnet intern auf 0..1 um
; und bildet das auf den hier angegebenen Bereich ab.
;   0 -> -60 dB, 64 -> ~-23,7 dB, 127 -> +12 dB
; Ohne diese Zeilen bliebe es bei 0.0..1.0 und die Engine stuende auf -60 dB.
/strip/[0-7]/gain = f -60.0 12.0
/bus/[0-7]/gain = f -60.0 12.0
/strip/[0-7]/mute = f 0.0 1.0
/strip/[0-7]/solo = f 0.0 1.0
/strip/[0-7]/mono = f 0.0 1.0
/bus/[0-7]/mute = f 0.0 1.0

; ==================================================================
; 3. Zuordnung
; ==================================================================
;
; Belegung des nanoKONTROL2 in der Werks-Szene (MIDI-Kanal 1 = ch0):
;   Fader 1..8   CC 0..7        Regler 1..8  CC 16..23
;   SOLO  1..8   CC 32..39      MUTE  1..8   CC 48..55
;   REC   1..8   CC 64..71      Transport    CC 41..46
; Die Transport-Tasten bleiben hier ohne Zuordnung - sie kommen an und
; werden ignoriert.
[map]

; Acht Fader auf den Streifen-Gain. "<>" heisst beide Richtungen: neben dem
; Faderzug geht auch der Wert aus der Engine zurueck (mit
; CROSSPOINT_OSC_ECHO=1), was eine Oberflaeche mit Motorfadern oder LEDs
; nachfuehren kann.
nanokontrol2.ch0.cc{0..7} <> crosspoint./strip/{0..7}/gain

; Eine Taste je Streifen auf Mute. ">" ist Absicht: die Taste soll schalten,
; nicht dauerhaft senden. Damit das Auf/Zu schaltet und nicht nur solange
; man drueckt, im KORG KONTROL Editor das Tastenverhalten auf "Toggle"
; stellen - dann sendet das Geraet abwechselnd 127 und 0, und die LED zeigt
; den Zustand des Geraets.
; Wer die LED aus der Engine speisen will (Preset-Wechsel im Browser soll die
; Taste nachziehen), stellt im Editor den LED-Modus auf "External" und macht
; aus ">" ein "<>".
nanokontrol2.ch0.cc{48..55} > crosspoint./strip/{0..7}/mute

; Ein Regler als Summenregler auf Bus 0 (A1). Regler 1 ist CC 16; wer dafuer
; einen echten Fader opfern will, nimmt cc0 (dann oben aus der Fader-Zeile
; herausnehmen) oder cc15 (Regler 8, nur cc16 tauschen).
nanokontrol2.ch0.cc16 <> crosspoint./bus/0/gain
