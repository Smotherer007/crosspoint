[package]
name = "crosspoint-core"
version = "0.4.0"
edition = "2021"
description = "Crosspoint: 8x8-Mixer fuer PipeWire/JACK - Parametermodell, Mixer-Kern und Adapter"

[lib]
name = "crosspoint"
path = "src/lib.rs"

[dependencies]
tape = { path = "../tape" }
vban = { path = "../vban" }
macros = { path = "../macros" }
# JSON: lesen und schreiben statt Eigenbau (src/json.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lock-freier SPSC-Ring fuer die Tape-Bruecke (src/tape_io.rs).
rtrb = "0.4"
# HTTP-Server (synchron, ein Thread je Anfrage) und WebSocket (src/http.rs).
tiny_http = "0.12"
tungstenite = "0.30"
# JACK-Client statt handdeklariertem ABI (src/jack.rs); laedt libjack.so.0
# zur Laufzeit, braucht beim Bauen nur pkg-config (siehe .cargo/config.toml).
jack = "0.13"
# PipeWire-Zugriff ueber die offiziellen Bindings statt pw-dump/pw-link-Text
# (src/pw.rs). Braucht libpipewire-0.3 beim Bauen; die Header liegen unter
# packaging/pipewire-devel, siehe packaging/pkgconfig/libpipewire-0.3.pc.
pipewire = "0.10"
# Kleine Runtime im Registry-Thread (src/pw.rs): Ereignisse einsammeln,
# ohne die HTTP-Schicht zu blockieren. Nur rt + time, kein Netzwerk.
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
