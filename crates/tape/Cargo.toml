[package]
name = "tape"
version = "0.1.0"
edition = "2021"
description = "Tape-Recorder: schreibt interleaved f32-Bloecke als WAV (24-bit PCM oder IEEE float32), mit Rotation und Metadaten"
publish = false

[lib]
name = "tape"
path = "src/lib.rs"

# Eigenstaendig und unabhaengig von crosspoint. Einzige Abhaengigkeit ist
# `hound`: RIFF-Kopf, Sample-Kodierung und Groessen-Patch beim Schliessen.
[dependencies]
hound = "3.5"
