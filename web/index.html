<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vm8 — 8×8 Mixer</title>
<style>
  :root{--bg:#0a0e14;--panel:#111823;--panel2:#0d141d;--line:#1e2b3d;--txt:#c9d6e6;
        --dim:#6b7f96;--accent:#28d2c8;--warn:#ffb454;--hot:#ff5c5c;
        --mono:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12px}
  header{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line)}
  h1{font-size:13px;margin:0;letter-spacing:.16em;text-transform:uppercase}
  h1 span{color:var(--accent)}
  .tag{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
  .spacer{flex:1}
  button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
         background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:4px 8px;
         border-radius:3px;cursor:pointer}
  button:hover{border-color:var(--accent);color:#fff}
  main{padding:12px;display:flex;flex-direction:column;gap:12px}
  .row{display:grid;grid-template-columns:repeat(8,minmax(112px,1fr));gap:8px}
  .section-title{font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:-6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px;
        display:flex;flex-direction:column;gap:5px}
  .card.bus{background:var(--panel2)}
  .name{font-size:11px;display:flex;justify-content:space-between}
  .body{display:flex;gap:6px;align-items:stretch}
  .meter{width:8px;background:#060a10;border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden}
  .meter i{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(0deg,var(--accent),#7ef7b4 70%,var(--hot))}
  .fader{writing-mode:vertical-lr;direction:rtl;width:24px;height:104px;accent-color:var(--accent);cursor:ns-resize}
  .db{font-size:10px;color:var(--accent);text-align:center}
  .btns{display:flex;gap:3px}
  .btns button{flex:1;padding:2px 0;font-size:9px}
  .btns button.on{background:var(--accent);color:#04121a;border-color:var(--accent)}
  .btns button.solo.on{background:var(--warn);border-color:var(--warn)}
  .sends{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
  .sends button{padding:2px 0;font-size:9px}
  .sends button.on{background:#1d5f5b;color:#d8fffb;border-color:var(--accent)}
  footer{color:var(--dim);font-size:10px;padding:0 14px 16px}
  #notice{color:var(--warn);font-size:10px}
</style>
</head>
<body>
<header>
  <h1>vm8<span>-linux</span></h1>
  <span class="tag">8×8 · PipeWire/JACK</span>
  <span class="spacer"></span>
  <span id="notice"></span>
  <span class="tag" id="status">lade…</span>
  <button id="save">Preset speichern</button>
  <button id="load">Preset laden</button>
</header>
<main>
  <div class="section-title">Streifen — EQ → Comp → Gate → Denoiser → Gain → Pan → Routing</div>
  <div class="row" id="strips"></div>
  <div class="section-title">Busse — A1…A5 Hardware, B1…B3 virtuell</div>
  <div class="row" id="buses"></div>
</main>
<footer>Pegel = Block-Peak, 2×/s vom Server gelesen. Preset: ~/.config/vm8-linux/preset.json</footer>
<script>
const BUSNAMES=["A1","A2","A3","A4","A5","B1","B2","B3"];
let stripEls=[],busEls=[],built=false;

const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const api=(path,body)=>fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{}).then(r=>r.json());
const setP=(target,index,param,value)=>api("/api/set",{target,index,param,value});

function build(s){
  const sc=document.getElementById("strips");sc.innerHTML="";stripEls=[];
  s.strips.forEach((st,i)=>{
    const c=el("div","card");
    const n=el("div","name");n.appendChild(el("span",null,st.name));c.appendChild(n);
    const body=el("div","body"),m=el("div","meter"),bar=el("i");m.appendChild(bar);body.appendChild(m);
    const w=el("div");w.style.cssText="display:flex;flex-direction:column;align-items:center";
    const f=el("input","fader");f.type="range";f.min=-60;f.max=12;f.step=0.5;f.value=st.gain;
    const db=el("div","db",(+st.gain).toFixed(1)+" dB");
    w.append(f,db);body.appendChild(w);c.appendChild(body);
    const b=el("div","btns");const bm=el("button",null,"M"),bs=el("button","solo","S"),bo=el("button",null,"Ø");
    bm.onclick=()=>setP("strip",i,"mute",bm.classList.contains("on")?0:1);
    bs.onclick=()=>setP("strip",i,"solo",bs.classList.contains("on")?0:1);
    bo.onclick=()=>setP("strip",i,"mono",bo.classList.contains("on")?0:1);
    b.append(bm,bs,bo);c.appendChild(b);
    const fx=el("div","btns");const be=el("button",null,"EQ"),bc=el("button",null,"C"),bg=el("button",null,"G");
    be.onclick=()=>setP("strip",i,"eq",be.classList.contains("on")?0:1);
    bc.onclick=()=>setP("strip",i,"comp",bc.classList.contains("on")?0:1);
    bg.onclick=()=>setP("strip",i,"gate",bg.classList.contains("on")?0:1);
    fx.append(be,bc,bg);c.appendChild(fx);
    const sd=el("div","sends");const sdEls=[];
    BUSNAMES.forEach((bn,k)=>{const sb=el("button",null,bn);
      sb.onclick=()=>setP("strip",i,"send"+k,sb.classList.contains("on")?0:1);
      sd.appendChild(sb);sdEls.push(sb);});
    c.appendChild(sd);sc.appendChild(c);
    f.oninput=()=>{db.textContent=(+f.value).toFixed(1)+" dB";setP("strip",i,"gain",+f.value);};
    stripEls.push({bar,f,db,bm,bs,bo,be,bc,bg,sd:sdEls});
  });
  const bc2=document.getElementById("buses");bc2.innerHTML="";busEls=[];
  s.buses.forEach((bs,i)=>{
    const c=el("div","card bus");
    const n=el("div","name");n.append(el("span",null,"Bus "+bs.name),el("span","tag",bs.limiter?"LIM":""));c.appendChild(n);
    const body=el("div","body"),m=el("div","meter"),bar=el("i");m.appendChild(bar);body.appendChild(m);
    const w=el("div");w.style.cssText="display:flex;flex-direction:column;align-items:center";
    const f=el("input","fader");f.type="range";f.min=-60;f.max=12;f.step=0.5;f.value=bs.gain;
    const db=el("div","db",(+bs.gain).toFixed(1)+" dB");
    w.append(f,db);body.appendChild(w);c.appendChild(body);
    const b=el("div","btns");const bm=el("button",null,"M"),bl=el("button",null,"LIM");
    bm.onclick=()=>setP("bus",i,"mute",bm.classList.contains("on")?0:1);
    bl.onclick=()=>setP("bus",i,"limiter",bl.classList.contains("on")?0:1);
    b.append(bm,bl);c.appendChild(b);
    f.oninput=()=>{db.textContent=(+f.value).toFixed(1)+" dB";setP("bus",i,"gain",+f.value);};
    bc2.appendChild(c);busEls.push({bar,f,db,bm,bl});
  });
  built=true;
}

function apply(s){
  s.strips.forEach((st,i)=>{const e=stripEls[i];if(!e)return;
    if(document.activeElement!==e.f){e.f.value=st.gain;e.db.textContent=(+st.gain).toFixed(1)+" dB";}
    e.bm.classList.toggle("on",!!st.mute);e.bs.classList.toggle("on",!!st.solo);
    e.bo.classList.toggle("on",!!st.mono);e.be.classList.toggle("on",!!st.eq);
    e.bc.classList.toggle("on",!!st.comp);e.bg.classList.toggle("on",!!st.gate);
    st.sends.forEach((v,k)=>e.sd[k].classList.toggle("on",v>0));});
  s.buses.forEach((bs,i)=>{const e=busEls[i];if(!e)return;
    if(document.activeElement!==e.f){e.f.value=bs.gain;e.db.textContent=(+bs.gain).toFixed(1)+" dB";}
    e.bm.classList.toggle("on",!!bs.mute);e.bl.classList.toggle("on",!!bs.limiter);});
}

async function tick(){
  try{
    const st=await api("/api/state");
    if(!built) build(st); else apply(st);
    const lv=await api("/api/levels");
    const px=db=>Math.max(0,Math.min(100,(db+60)/72*100))+"%";
    lv.strips.forEach((db,i)=>{if(stripEls[i])stripEls[i].bar.style.height=px(db);});
    lv.buses.forEach((db,i)=>{if(busEls[i])busEls[i].bar.style.height=px(db);});
    document.getElementById("status").textContent="läuft · "+st.sample_rate+" Hz";
    document.getElementById("notice").textContent="";
  }catch(e){document.getElementById("status").textContent="getrennt";}
}
document.getElementById("save").onclick=()=>api("/api/preset",{action:"save"});
document.getElementById("load").onclick=()=>api("/api/preset",{action:"load"});
setInterval(tick,500);tick();
</script>
</body>
</html>
