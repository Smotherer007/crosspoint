name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Die Engine linkt gegen libjack.so.0 (Soname). Auf dem Runner fehlt sie
      # ohne dieses Paket - dann baut die Lib, aber das Test-Binary scheitert
      # beim Laden. jackd2 liefert die ABI-kompatible Client-Bibliothek.
      - name: JACK-Bibliothek
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjack-jackd2-dev
      # Gestartet wird im CI nichts: kein PipeWire, kein Audio.
      - name: Clippy (nur echte Fehler blockieren)
        run: cargo clippy --all-targets --locked -- -D clippy::correctness
      - name: Tests
        run: cargo test --locked
      - name: Release-Build
        run: cargo build --release --locked

  metadata:
    name: Paket-Metadaten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream
          desktop-file-validate packaging/linux/*.desktop
          appstreamcli validate --no-net packaging/linux/*.metainfo.xml

  flatpak:
    name: Flatpak bauen
    runs-on: ubuntu-latest
    # Container mit fertigem flatpak-builder und GNOME-Runtime; ohne ihn
    # scheitert der Schritt bereits beim Setup (Image/Action-Paar).
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: crosspoint-ci.flatpak
          manifest-path: flatpak/de.weppelmann.Crosspoint.yml
