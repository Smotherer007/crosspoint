name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Die Engine linkt gegen libjack.so.0 (Soname) und spricht PipeWire ueber
      # die offiziellen Bindings (pipewire-sys -> bindgen). Ohne die Pakete
      # baut die Lib, aber das Test-Binary scheitert beim Laden, bzw. bindgen
      # findet libclang nicht.
      - name: Systembibliotheken
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjack-jackd2-dev libpipewire-0.3-dev libspa-0.1-dev libclang-dev pkg-config
      # Gestartet wird im CI nichts: kein PipeWire, kein Audio.
      - name: Clippy (nur echte Fehler blockieren)
        run: cargo clippy --all-targets --locked --workspace -- -D clippy::correctness
      - name: Tests
        run: cargo test --locked --workspace
      - name: Release-Build
        run: cargo build --release --locked
      # Der Flatpak-Job baut im Container ohne Rust; er bekommt das Binary hier.
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: target/release/crosspoint-engine

  metadata:
    name: Paket-Metadaten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils appstream
          desktop-file-validate packaging/linux/*.desktop
          appstreamcli validate --no-net packaging/linux/*.metainfo.xml

  flatpak:
    name: Flatpak bauen
    needs: test
    runs-on: ubuntu-latest
    # Container mit fertigem flatpak-builder und GNOME-Runtime; ohne ihn
    # scheitert der Schritt bereits beim Setup (Image/Action-Paar).
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: prebuilt
      - run: chmod +x prebuilt/crosspoint-engine
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: crosspoint-ci.flatpak
          manifest-path: flatpak/de.weppelmann.Crosspoint.yml
