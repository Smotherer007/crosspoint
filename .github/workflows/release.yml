name: Release

# Ablauf wie im Nachbarprojekt: Conventional Commits auf main, release-please
# haelt einen Release-PR aktuell; dessen Merge erzeugt Tag und Release, dieser
# Workflow baut die Pakete und haengt sie an.
#
# Zwei getrennte Paket-Jobs, weil die Umgebungen sich ausschliessen:
#   flatpak    braucht den GNOME-Container (flatpak-builder, Runtime, WebKit)
#   tarball    braucht apt und libjack auf einem normalen Ubuntu-Runner
# In einem Job scheitert beides: im Container gibt es kein apt, auf dem Runner
# kein vorinstalliertes flatpak-builder.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Vorhandener Tag, z. B. v0.1.1
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    if: >-
      always() && (
        needs.release-please.outputs.created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          RP_TAG: ${{ needs.release-please.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RP_TAG" ]; then TAG="$RP_TAG"
          elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          else TAG="$GITHUB_REF_NAME"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Release anlegen, falls nicht vorhanden
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  flatpak:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    name: Flatpak-Bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/de.weppelmann.Crosspoint.yml
          bundle: crosspoint-${{ needs.prepare.outputs.version }}-x86_64.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: crosspoint-*.flatpak

  tarball:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    name: Tarball
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: JACK-Bibliothek
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjack-jackd2-dev
      - name: Bauen
        run: cargo build --release --locked
      - name: Paket schnueren
        run: |
          mkdir -p dist
          cp target/release/crosspoint-engine dist/
          cp scripts/crosspoint-launch.sh scripts/crosspoint-start.sh scripts/crosspoint-wire.sh dist/
          cp packaging/linux/de.weppelmann.Crosspoint.desktop dist/
          cp docs/brand/crosspoint-icon-1024.png dist/crosspoint.png
          tar -C dist -czf "crosspoint-${VERSION}-linux-x86_64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: crosspoint-*.tar.gz

  attach:
    needs: [prepare, flatpak, tarball]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Pakete pruefen
        run: |
          ls -l pakete
          if ! ls pakete/*.flatpak pakete/*.tar.gz >/dev/null 2>&1; then
            echo "Keine Pakete im Artefakt - Abbruch statt stillem Erfolg"; exit 1
          fi
      - name: Release sicherstellen, veroeffentlichen, Pakete anhaengen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Ein vorhandener Draft ist ueber die anonyme API unsichtbar, `view`
          # findet ihn aber. Fehlt er ganz, wird er veroeffentlicht angelegt.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" pakete/* -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
