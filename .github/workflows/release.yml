name: Release

# Ablauf wie im Nachbarprojekt: Conventional Commits auf main, release-please
# haelt einen Release-PR aktuell; dessen Merge erzeugt Tag und Release, dieser
# Workflow baut die Pakete und haengt sie an.
#
# Zwei getrennte Paket-Jobs, weil die Umgebungen sich ausschliessen:
#   flatpak    braucht den GNOME-Container (flatpak-builder, Runtime, WebKit)
#   tarball    braucht apt und libjack auf einem normalen Ubuntu-Runner
# In einem Job scheitert beides: im Container gibt es kein apt, auf dem Runner
# kein vorinstalliertes flatpak-builder.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Vorhandener Tag, z. B. v0.1.1
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    if: >-
      always() && (
        needs.release-please.outputs.created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          RP_TAG: ${{ needs.release-please.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RP_TAG" ]; then TAG="$RP_TAG"
          elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          else TAG="$GITHUB_REF_NAME"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Release anlegen, falls nicht vorhanden
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  # Genau der Aufbau des wled-Projekts: Container mit flatpak-builder, dann die
  # offizielle Action. Der eigene apt-Weg scheiterte an "sudo flatpak run",
  # die Action-Variante an fehlender AppStream-Datei im Build.
  flatpak:
    needs: [prepare, tarball]
    if: always() && needs.prepare.result == 'success' && needs.tarball.result == 'success'
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      # Die Engine kommt fertig gebaut aus dem Tarball-Job - im Flatpak-Build
      # gibt es kein cargo.
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: prebuilt
      - name: Ausfuehrbar machen
        run: chmod +x prebuilt/crosspoint-engine prebuilt/crosspoint && ls -l prebuilt prebuilt
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: crosspoint-${{ needs.prepare.outputs.version }}-x86_64.flatpak
          manifest-path: flatpak/de.weppelmann.Crosspoint.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  tarball:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    name: Tarball
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: JACK-Bibliothek
        run: |
          sudo apt-get update -qq
          # pipewire-sys braucht Header und libclang, sonst scheitert der Bau
          # von crosspoint-core (Geraeteschicht seit 0.3.0 ueber die Crate).
          sudo apt-get install -y -qq libjack-jackd2-dev libpipewire-0.3-dev libclang-dev pkg-config
      - name: Bauen
        run: cargo build --release --locked
      - name: Oberflaeche bauen
        run: |
          sudo apt-get install -y -qq libgtk-4-dev
          cargo build --release --locked --features ui --bin crosspoint
      - name: Paket schnueren
        run: |
          mkdir -p dist
          cp target/release/crosspoint-engine dist/
          cp target/release/crosspoint dist/
          cp scripts/crosspoint-launch.sh scripts/crosspoint-start.sh scripts/crosspoint-wire.sh dist/
          cp packaging/linux/de.weppelmann.Crosspoint.desktop dist/
          cp docs/brand/crosspoint-icon-1024.png dist/crosspoint.png
          tar -C dist -czf "crosspoint-${VERSION}-linux-x86_64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            target/release/crosspoint-engine
            target/release/crosspoint
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: crosspoint-*.tar.gz

  attach:
    # Wartet auf beide Paket-Jobs. Faellt einer aus, wird trotzdem
    # veroeffentlicht, was da ist (die Pruefung unten verlangt mindestens eins).
    needs: [prepare, tarball, flatpak]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Pakete pruefen
        run: |
          find pakete -type f -printf '%p %s Bytes\n'
          anzahl=$(find pakete -type f \( -name '*.tar.gz' -o -name '*.flatpak' \) | wc -l)
          echo "Pakete gefunden: $anzahl"
          if [ "$anzahl" -eq 0 ]; then
            echo "Keine Pakete im Artefakt - Abbruch statt stillem Erfolg"; exit 1
          fi
          find pakete -type f -name '*.flatpak' | grep -q . ||
            echo "::warning::Flatpak-Bundle fehlt in diesem Lauf - nur der Tarball wird veroeffentlicht"
      - name: Release sicherstellen, veroeffentlichen, Pakete anhaengen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Ein vorhandener Draft ist ueber die anonyme API unsichtbar, `view`
          # findet ihn aber. Fehlt er ganz, wird er veroeffentlicht angelegt.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          find pakete -type f \( -name '*.tar.gz' -o -name '*.flatpak' \) -print0 |
            xargs -0 gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
