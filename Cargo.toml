[package]
name = "crosspoint"
version = "0.4.0"
edition = "2021"
description = "Crosspoint: 8x8-Mixer fuer PipeWire/JACK - Engine und Oberflaeche in einem Prozess"

# Der Kern (Parametermodell, DSP, Adapter) liegt in `crates/core` und wird hier
# als `crosspoint` eingebunden. Grund fuer den Umzug: Cargo erlaubt keine
# Paketzyklen - die Oberflaeche braucht den Kern, und dieses Paket braucht fuer
# das Fenster die Oberflaeche. Mit dem Kern als eigenem Paket zeigt der Pfeil
# in nur eine Richtung: core -> ui -> dieses Paket.
[dependencies]
crosspoint = { package = "crosspoint-core", path = "crates/core" }
# GTK-Oberflaeche, nur mit Feature `ui`. Ohne das Feature wird dieses Paket
# gebaut wie bisher: kein GTK, keine GTK-Header, kein `gtk4` im
# Abhaengigkeitsbaum - so baut auch die CI, die kein GTK hat.
crosspoint-ui = { path = "crates/ui-gtk", optional = true }

[features]
default = []
# Ein Prozess fuer Engine und Fenster: `cargo build --features ui` baut das
# Binary `crosspoint`. Ohne das Feature entsteht nur `crosspoint-engine`.
ui = ["dep:crosspoint-ui"]

[[bin]]
name = "crosspoint-engine"
path = "src/main.rs"

[[bin]]
name = "crosspoint"
path = "src/bin/crosspoint.rs"
required-features = ["ui"]

[workspace]
members = ["crates/core", "crates/vban", "crates/tape", "crates/macros"]
# Die GTK-Oberflaeche ist ein eigenes Paket mit eigener [workspace]-Tabelle:
# sie laesst sich unabhaengig bauen (cargo build --manifest-path ...) und
# bringt GTK nur dann in den Abhaengigkeitsbaum, wenn jemand sie anfasst.
exclude = ["crates/ui-gtk"]
