[package]
name = "vm8"
version = "0.1.0"
edition = "2021"
description = "VoiceMeeter-Nachbau in Rust: Parametermodell und Mixer-Kern"

[lib]
name = "vm8"
path = "src/lib.rs"

[dependencies]
tape = { path = "crates/tape" }
vban = { path = "crates/vban" }
macros = { path = "crates/macros" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

[[bin]]
name = "vm8-engine"
path = "src/main.rs"

[workspace]
members = ["crates/vban", "crates/tape", "crates/macros"]
