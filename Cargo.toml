[package]
name = "crosspoint"
version = "0.2.0"
edition = "2021"
description = "Crosspoint: 8x8-Mixer fuer PipeWire/JACK - Parametermodell und Mixer-Kern"

[lib]
name = "crosspoint"
path = "src/lib.rs"

[dependencies]
tape = { path = "crates/tape" }
vban = { path = "crates/vban" }
macros = { path = "crates/macros" }
# JSON: lesen und schreiben statt Eigenbau (src/json.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lock-freier SPSC-Ring fuer die Tape-Bruecke (src/tape_io.rs).
rtrb = "0.4"
# HTTP-Server (synchron, ein Thread je Anfrage) und WebSocket (src/http.rs).
tiny_http = "0.12"
tungstenite = "0.30"
# JACK-Client statt handdeklariertem ABI (src/jack.rs); laedt libjack.so.0
# zur Laufzeit, braucht beim Bauen nur pkg-config (siehe .cargo/config.toml).
jack = "0.13"

[[bin]]
name = "crosspoint-engine"
path = "src/main.rs"

[workspace]
members = ["crates/vban", "crates/tape", "crates/macros"]
